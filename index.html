<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Silly Morse Thing</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">Morse Input Generator</h1>
        <p class="subtitle">
          If for some reason you want morse code, but without the lines and
          dashes.
        </p>
      </header>

      <section class="section">
        <p class="section-description">
          Choose which symbols you want to represent dots and dashes.
        </p>
<div class="input-group">

    <label for="symbolPreset">Preset Pairings</label>

    <select id="symbolPreset" onchange="applyPreset()">
        <option value="">-- Choose a Preset --</option>
        <option value="standard">Standard (Dots & Dashes)</option>
        <option value="flowers">Flowers</option>
        <option value="numbers">Numbers</option>
        <option value="shapes">Shapes</option>
        <option value="stars">Stars</option>
        <option value="birds">Birds</option>
    </select>

</div>
        <div class="symbol-container">
          <div class="input-group">
            <label for="dotSymbol">Dot Replacement (.)</label>
            <input
              type="text"
              id="dotSymbol"
              maxlength="1"
              placeholder="Example: ."
            />
          </div>

          <div class="input-group">
            <label for="dashSymbol">Dash Replacement (-)</label>
            <input
              type="text"
              id="dashSymbol"
              maxlength="1"
              placeholder="Example: -"
            />
          </div>
        </div>
      </section>
<hr>
      <section class="section">
        <p class="section-description">
          Type the message you would like to convert.
        </p>

        <div class="input-group">
          <label for="textToMorse">Your Message</label>

          <textarea
            id="textToMorse"
            rows="5"
            placeholder="Enter your text here..."
          ></textarea>
        </div>

        <button onclick="handleTextToMorseTranslate()" class="btn">
          Generate
        </button>
      </section>

      <!-- OUTPUT -->
      <section class="section">
        <label id="output-label">Your Message</label>
        <div class="output-container">
          <div id="textToMorseOutput">
            Your custom Morse code will appear here...
          </div>
        </div>

        <button onclick="copyTextToMorseOutput()" class="btn">
          Copy Translation
        </button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
